    else if(k==='core'){dot(x,cyR,15,C.teal);T(s[0],x,cyR+4.5,{size:12,w:700,c:'#fff',a:'center'});}
    else{dot(x,cyR,15,'#fff',C.teal,2);T(s[0],x,cyR+4.5,{size:12,w:700,c:C.teal,a:'center'});}
    T(s[1],x,cyR+38,{size:13.5,w:700,a:'center'});
    T(s[2],x,cyR+54,{size:10.5,c:C.mut,a:'center'});
    T(s[3],x,cyR+70,{size:12,a:'center'});
    T(s[4],x,cyR+84,{size:10,c:C.mut,a:'center'});});
}

/* ------- font loading, then draw ------- */
const sample=(document.getElementById('src').textContent||'').replace(/\s+/g,'');
const uniq=Array.from(new Set(sample.split(''))).join('');
const msg=document.getElementById('msg');
function setMsg(t){msg.textContent=t;}
async function init(){
  draw();
  try{
    const ws=[400,500,700,900];
    await Promise.race([Promise.all(ws.map(w=>document.fonts.load(w+' 20px "Noto Sans TC"',uniq))),new Promise(r=>setTimeout(r,6000))]);
  }catch(e){}
  draw();
}
init();

/* ------- export ------- */
function toBlob(){return new Promise(res=>cv.toBlob(res,'image/jpeg',0.95));}
document.getElementById('dl').addEventListener('click',async()=>{
  try{
    draw();
    const blob=await toBlob();
    const d=window.claude?await window.claude.use('downloads'):null;
    if(!d){setMsg('此環境無法直接下載，請按「轉成圖片」後長按或右鍵儲存。Direct download unavailable — use “convert to image” and save it.');return;}
    await d.save({filename:'optimization-infographic-3200x1800.jpg',data:blob});
    setMsg('已送出儲存請求。Save request sent.');
  }catch(e){
    if(e&&e.code==='declined')setMsg('已取消儲存。Save cancelled.');
    else setMsg('下載失敗，請改用「轉成圖片」。Download failed — try “convert to image”.');
  }
});
document.getElementById('asimg').addEventListener('click',async()=>{
  try{
    draw();
    const blob=await toBlob();
    const url=URL.createObjectURL(blob);
    const st=document.getElementById('stage');
    st.innerHTML='';
    const im=new Image();im.src=url;im.alt='優化資訊圖表 JPG（3200×1800）';st.appendChild(im);
    setMsg('現在是 JPG 圖片，請長按（手機）或按右鍵（電腦）儲存。Now a JPG image — long-press or right-click to save.');
  }catch(e){setMsg('轉換失敗。Conversion failed.');}
});
})();
</script>
