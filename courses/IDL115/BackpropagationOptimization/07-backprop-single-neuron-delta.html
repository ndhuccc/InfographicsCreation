<script>
'use strict';
/* ===== InfographicsCreation shared runtime (Canvas 1600x900 + KaTeX math layer) ===== */
const W = 1600, H = 900;
const P = { paper:'#f3f6fb', grid:'#dfe7f2', ink:'#0f2347', muted:'#475b7d', faint:'#8ea3c3', line:'#c7d4e8',
  blue:'#2459d6', blueS:'#dde8fd', red:'#d3342a', redS:'#fde3df', green:'#12935a', greenS:'#d7f2e4',
  amber:'#d9760a', amberS:'#fdebcd', violet:'#6a43dc', violetS:'#e7dffb', white:'#ffffff', navy:'#0f2347' };
const FZ = '"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif';
const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
const stage = document.getElementById('stage'), mathLayer = document.getElementById('math-layer');
const AUD = { on: !!window.__AUDIT_ON, text: [], bad: [] };

/* ---------- font loading for canvas text ---------- */
const seenChars = new Set(); let pendingChars = '', fontTimer = null;
function noteChars(s){
  for (const ch of s){ if (!seenChars.has(ch)){ seenChars.add(ch); pendingChars += ch; } }
  if (pendingChars && !fontTimer && document.fonts && document.fonts.load){
    fontTimer = setTimeout(() => {
      const txt = pendingChars; pendingChars = ''; fontTimer = null;
      Promise.all([400,500,600,700,800,900].map(w => document.fonts.load(w + ' 16px "Noto Sans TC"', txt).catch(()=>0)))
        .then(() => requestDraw());
    }, 40);
  }
}
/* ---------- text ---------- */
function T(s, x, y, o){

  const size = o.size || 18, weight = o.weight || 500, align = o.align || 'left';
  if (/[\^_]\{/.test(s)) return Tsup(s, x, y, o, size, weight, align);

  ctx.fillStyle = o.color || P.ink; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillText(s, x, y);
  const w = ctx.measureText(s).width;
  if (AUD.on){
    const x0 = align === 'center' ? x - w/2 : align === 'right' ? x - w : x;
    AUD.text.push({ x0, y0: y - size*0.6, x1: x0 + w, y1: y + size*0.6, s, ok: !!o.ok, maxW: o.maxW });
    if (/\\n/.test(s)) AUD.bad.push('literal \\n in text: ' + s);
  }
  return w;
}
function Tsup(s, x, y, o, size, weight, align){
  const parts = [], re = /([\^_])\{([^}]*)\}/g; let last = 0, m, total = 0;
  while ((m = re.exec(s))){ if (m.index > last) parts.push([s.slice(last, m.index), 0]); parts.push([m[2], m[1] === '^' ? 1 : 2]); last = re.lastIndex; }

  let cx = align === 'center' ? x - total/2 : align === 'right' ? x - total : x;
  ctx.fillStyle = o.color || P.ink; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  parts.forEach(p => { ctx.font = weight + ' ' + p.sz + 'px ' + FZ; ctx.fillText(p[0], cx, y + (p[1] === 1 ? -size * 0.34 : p[1] === 2 ? size * 0.2 : 0)); cx += p.w; });
  if (AUD.on){ const x0 = align === 'center' ? x - total/2 : align === 'right' ? x - total : x; AUD.text.push({ x0, y0: y - size*0.75, x1: x0 + total, y1: y + size*0.6, s, ok: !!o.ok, maxW: o.maxW }); }

}
const CJK = /[\u2E80-\u9FFF\uF900-\uFAFF\uFF00-\uFFEF\u3000-\u303F\u2014\u2026]/;
const CLOSERS = '，。、；：！？）」』》…—,.;:!?)';
function tokenize(s){
  const out = []; let buf = '';

    if (CJK.test(ch)){
      if (buf){ out.push(buf); buf = ''; }
      if (CLOSERS.indexOf(ch) >= 0 && out.length) out[out.length-1] += ch; else out.push(ch);
    } else if (ch === ' '){ buf += ch; out.push(buf); buf = ''; } else buf += ch;

}
function wrapLines(s, maxW, size, weight){
  ctx.font = weight + ' ' + size + 'px ' + FZ;
  const lines = []; let cur = '';
  for (const t of tokenize(s)){

    if (cur && ctx.measureText(test).width > maxW){ lines.push(cur.trimEnd()); cur = t.trimStart(); } else cur = test;
  }

}
/* wrap(text, x, y, maxWidth, lineHeight, fontSize, color, weight, align) -> number of lines.
   textAlign=left: x is the left edge; center: x is the visual centre; right: x is the right edge. */
function wrap(t, x, y, maxW, lh, size, color, weight, align){
  t = String(t).replace(/\\n/g, '\n'); size = size || 18; weight = weight || 500; align = align || 'left';
  let n = 0;
  for (const para of t.split('\n')){
    for (const l of wrapLines(para, maxW, size, weight)){ T(l, x, y + n*lh, { size, weight, color, align, maxW }); n++; }
  }
  return n;
}
function wrapCenter(t, cx, y, maxW, lh, size, color, weight){ return wrap(t, cx, y, maxW, lh, size, color, weight, 'center'); }
function textWidth(s, size, weight){ ctx.font = (weight||500) + ' ' + size + 'px ' + FZ; return ctx.measureText(String(s)).width; }

/* ---------- shapes ---------- */
function rr(x, y, w, h, r){
  ctx.beginPath(); ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath();
}
function panel(x, y, w, h, o){
  o = o || {}; rr(x, y, w, h, o.r == null ? 16 : o.r);
  ctx.fillStyle = o.fill || '#fff'; ctx.fill();
  if (o.lw !== 0){ ctx.strokeStyle = o.stroke || P.line; ctx.lineWidth = o.lw || 1.6; ctx.stroke(); }
}
function arrow(x1, y1, x2, y2, color, lw, hs){
  lw = lw || 3; hs = hs || 11; const a = Math.atan2(y2-y1, x2-x1);
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - Math.cos(a)*hs*0.6, y2 - Math.sin(a)*hs*0.6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - hs*Math.cos(a-0.45), y2 - hs*Math.sin(a-0.45));
  ctx.lineTo(x2 - hs*Math.cos(a+0.45), y2 - hs*Math.sin(a+0.45)); ctx.closePath(); ctx.fill();

function dot(x, y, r, fill, stroke, lw){
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
  if (fill){ ctx.fillStyle = fill; ctx.fill(); }
  if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1.5; ctx.stroke(); }
}
function line(x1, y1, x2, y2, color, lw, dash){
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.strokeStyle = color; ctx.lineWidth = lw || 1.5;
  ctx.setLineDash(dash || []); ctx.stroke(); ctx.setLineDash([]);

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;

/* ---------- page chrome ---------- */
function chrome(m){
  ctx.fillStyle = P.paper; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = P.grid; ctx.lineWidth = 1; ctx.beginPath();
  for (let x = 0; x <= W; x += 40){ ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, H); }
  for (let y = 0; y <= H; y += 40){ ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5); }
  ctx.stroke();
  const cw = textWidth(m.tag, 15.5, 700) + 30;
  rr(40, 24, cw, 28, 14); ctx.strokeStyle = P.blue; ctx.lineWidth = 1.6; ctx.stroke();
  T(m.tag, 40 + cw/2, 38.5, { size: 15.5, weight: 700, color: P.blue, align: 'center' });
  T(m.zh, 40, 82, { size: 42, weight: 900, color: P.ink });
  T(m.en, 42, 119, { size: 22, weight: 500, color: P.blue });
  T('IDL 115 · Chapter 3 — Backpropagation & Optimization in Deep Neural Networks', 40, 886, { size: 13.5, weight: 400, color: P.muted });
  T(m.foot, W - 40, 886, { size: 13.5, weight: 600, color: P.muted, align: 'right' });
}

/* ---------- KaTeX math layer (shares the 1600x900 logical coordinate system) ---------- */
const MATH = {};
function placeFormula(m){
  const o = m.o, el = m.el;
  el.style.fontSize = (o.size || 28) + 'px'; el.style.color = o.color || P.ink; el.style.width = o.width + 'px';
  el.className = 'formula ' + (o.align || 'center');
  const left = o.align === 'left' ? o.x : o.align === 'right' ? o.x - o.width : o.x - o.width/2;
  el.style.left = left + 'px'; el.style.top = o.y + 'px';
  el.style.transform = 'translate(' + (o.offsetX || 0) + 'px,' + ((o.offsetY || 0) - 0) + 'px) translateY(-50%)';
}
function addFormula(o){
  const el = document.createElement('div'); mathLayer.appendChild(el);
  const m = MATH[o.id] = { el, o: Object.assign({ align:'center', size:28, width:600 }, o), tex: null };
  placeFormula(m); setFormula(o.id, o.tex); return m;
}
function setFormula(id, tex, patch){
  const m = MATH[id]; if (!m) return;
  if (patch){ Object.assign(m.o, patch); placeFormula(m); }
  if (m.tex !== tex){
    m.tex = tex;
    if (window.katex) window.katex.render(tex, m.el, { displayMode: true, throwOnError: false });
    else { m.el.textContent = ''; AUD.bad.push('KaTeX not loaded'); }
  }
}
function showFormula(id, on){ const m = MATH[id]; if (m) m.el.style.visibility = on ? 'visible' : 'hidden'; }
function syncMathLayer(){
  const r = stage.getBoundingClientRect();
  mathLayer.style.transform = 'scale(' + (r.width / W) + ',' + (r.height / H) + ')';
}

/* ---------- canvas widgets (slider / segmented / button) ---------- */
const UI = { items: [], focus: -1, drag: null, hover: -1 };
function sliderVal(it, t){
  let v = it.log ? Math.pow(10, lerp(Math.log10(it.min), Math.log10(it.max), t)) : lerp(it.min, it.max, t);
  if (it.step) v = Math.round(v / it.step) * it.step;
  return clamp(+v.toFixed(6), it.min, it.max);
}
function sliderT(it){ return it.log ? (Math.log10(it.value) - Math.log10(it.min)) / (Math.log10(it.max) - Math.log10(it.min)) : (it.value - it.min) / (it.max - it.min); }
function slider(o){ const it = Object.assign({ type:'slider', color:P.blue, fmt: v => String(v), value: o.min, visible: true }, o); UI.items.push(it); return it; }
function seg(o){ const it = Object.assign({ type:'seg', color:P.blue, h:42, visible: true }, o); UI.items.push(it); return it; }
function button(o){ const it = Object.assign({ type:'button', color:P.navy, h:42, visible: true }, o); UI.items.push(it); return it; }
function isVis(it){ return typeof it.visible === 'function' ? it.visible() : it.visible; }
function uiHit(it, px, py){
  if (it.type === 'slider') return px >= it.x - 14 && px <= it.x + it.w + 14 && py >= it.y - 8 && py <= it.y + 46;
  return px >= it.x && px <= it.x + it.w && py >= it.y && py <= it.y + it.h;
}
function uiDraw(){
  UI.items.forEach((it, idx) => {
    if (!isVis(it)) return;
    const focus = UI.focus === idx;
    if (it.type === 'slider'){
      T(it.label, it.x, it.y + 6, { size: 16, weight: 700, color: P.ink });
      T(it.fmt(it.value), it.x + it.w, it.y + 6, { size: 16, weight: 800, color: it.color, align: 'right' });
      const ty = it.y + 34, t = sliderT(it);
      rr(it.x, ty - 3, it.w, 6, 3); ctx.fillStyle = '#d5dfef'; ctx.fill();
      rr(it.x, ty - 3, it.w * t, 6, 3); ctx.fillStyle = it.color; ctx.fill();
      dot(it.x + it.w * t, ty, 11, '#fff', it.color, 3.2);
      if (focus){ dot(it.x + it.w * t, ty, 17, null, P.ink, 2); }
    } else if (it.type === 'seg'){
      const n = it.options.length, bw = it.w / n;
      panel(it.x, it.y, it.w, it.h, { r: 10, fill: '#eef3fb', stroke: P.line, lw: 1.4 });
      it.options.forEach((op, i) => {
        const on = op.id === it.value, bx = it.x + i * bw;
        if (on){ rr(bx + 3, it.y + 3, bw - 6, it.h - 6, 8); ctx.fillStyle = op.color || it.color; ctx.fill(); }
        T(op.label, bx + bw/2, it.y + it.h/2, { size: it.fs || 16, weight: 800, color: on ? '#fff' : P.muted, align: 'center', maxW: bw - 8 });
      });
      if (focus){ rr(it.x - 3, it.y - 3, it.w + 6, it.h + 6, 12); ctx.strokeStyle = P.ink; ctx.lineWidth = 2; ctx.stroke(); }
    } else if (it.type === 'button'){
      const dis = typeof it.disabled === 'function' ? it.disabled() : it.disabled;
      rr(it.x, it.y, it.w, it.h, 10);
      ctx.fillStyle = dis ? '#dfe6f2' : (it.ghost ? '#fff' : it.color); ctx.fill();
      ctx.strokeStyle = dis ? P.line : it.color; ctx.lineWidth = 1.8; ctx.stroke();
      T(typeof it.text === 'function' ? it.text() : it.text, it.x + it.w/2, it.y + it.h/2, { size: it.fs || 16, weight: 800, align: 'center', color: dis ? P.faint : (it.ghost ? it.color : '#fff'), maxW: it.w - 8 });
      if (focus){ rr(it.x - 3, it.y - 3, it.w + 6, it.h + 6, 12); ctx.strokeStyle = P.ink; ctx.lineWidth = 2; ctx.stroke(); }
    }

}
function uiSet(id, v){ const it = UI.items.find(i => i.id === id); if (!it) return; it.value = v; if (it.onChange) it.onChange(v); requestDraw(); }
function uiPoint(e){ const r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; }
canvas.addEventListener('pointerdown', e => {
  const [px, py] = uiPoint(e);
  for (let i = UI.items.length - 1; i >= 0; i--){
    const it = UI.items[i]; if (!isVis(it) || !uiHit(it, px, py)) continue;
    UI.focus = i; canvas.focus();
    if (it.type === 'slider'){ UI.drag = it; canvas.setPointerCapture(e.pointerId); const v = sliderVal(it, clamp((px - it.x) / it.w, 0, 1)); if (v !== it.value){ it.value = v; it.onChange && it.onChange(v); } }
    else if (it.type === 'seg'){ const k = clamp(Math.floor((px - it.x) / (it.w / it.options.length)), 0, it.options.length - 1); const v = it.options[k].id; if (v !== it.value){ it.value = v; it.onChange && it.onChange(v); } }

canvas.addEventListener('pointermove', e => {
  const [px, py] = uiPoint(e);
  if (UI.drag){ const it = UI.drag, v = sliderVal(it, clamp((px - it.x) / it.w, 0, 1)); if (v !== it.value){ it.value = v; it.onChange && it.onChange(v); requestDraw(); } return; }
  let over = false; UI.items.forEach(it => { if (isVis(it) && uiHit(it, px, py)) over = true; });
  canvas.style.cursor = over ? 'pointer' : 'default';

canvas.addEventListener('pointerup', () => { UI.drag = null; });
canvas.addEventListener('keydown', e => {
  const vis = UI.items.map((it, i) => i).filter(i => isVis(UI.items[i]));
  if (!vis.length) return;
  if (e.key === 'Tab'){
    const cur = vis.indexOf(UI.focus); let nxt = cur + (e.shiftKey ? -1 : 1);
    if (cur === -1) nxt = e.shiftKey ? vis.length - 1 : 0;
    if (nxt < 0 || nxt >= vis.length){ UI.focus = -1; requestDraw(); return; }
    UI.focus = vis[nxt]; e.preventDefault(); requestDraw(); return;
  }
  const it = UI.items[UI.focus]; if (!it) return;
  if (it.type === 'slider' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'ArrowUp')){
    const dir = (e.key === 'ArrowRight' || e.key === 'ArrowUp') ? 1 : -1, t = sliderT(it);
    const step = it.step ? (it.log ? 0 : it.step) : (it.max - it.min) / 50;
    let v = it.log ? sliderVal(it, clamp(t + dir * 0.05, 0, 1)) : clamp(+(it.value + dir * step).toFixed(6), it.min, it.max);
    it.value = v; it.onChange && it.onChange(v); e.preventDefault(); requestDraw();
  } else if (it.type === 'seg' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')){
    const k = it.options.findIndex(o => o.id === it.value), n = it.options.length;
    it.value = it.options[(k + (e.key === 'ArrowRight' ? 1 : n - 1)) % n].id; it.onChange && it.onChange(it.value); e.preventDefault(); requestDraw();

canvas.addEventListener('blur', () => { UI.focus = -1; requestDraw(); });

/* ---------- render loop ---------- */
let drawFn = null, pending = false, animating = false;

function fitCanvas(){

  const s = clamp(r.width * dpr / W, 1, 2.4), w = Math.round(W * s), h = Math.round(H * s);
  if (canvas.width !== w || canvas.height !== h){ canvas.width = w; canvas.height = h; }
  return s;
}
function render(now){
  pending = false; const s = fitCanvas(); ctx.setTransform(s, 0, 0, s, 0, 0);
  AUD.text.length = 0; AUD.bad.length = 0;
  ctx.clearRect(0, 0, W, H); drawFn(now || performance.now()); uiDraw();
  if (animating) requestDraw();

function start(fn, ariaLabel){

  requestDraw(); window.__ready = true;

/* ---------- audit hooks (used by the automated browser render audit) ---------- */
window.__ui = { set: uiSet, items: UI.items };
window.__audit = function(){
  const issues = [], M = 4, boxes = AUD.text;
  AUD.bad.forEach(b => issues.push('BAD: ' + b));
  boxes.forEach(b => {
    if (b.x0 < M || b.x1 > W - M || b.y0 < M || b.y1 > H - M) issues.push('OUT-OF-CANVAS: "' + b.s + '"');
    if (b.maxW && (b.x1 - b.x0) > b.maxW + 2) issues.push('WIDER-THAN-MAXW: "' + b.s + '" (' + Math.round(b.x1 - b.x0) + '>' + Math.round(b.maxW) + ')');
  });
  for (let i = 0; i < boxes.length; i++) for (let j = i + 1; j < boxes.length; j++){
    const a = boxes[i], b = boxes[j]; if (a.ok || b.ok) continue;
    const ox = Math.min(a.x1, b.x1) - Math.max(a.x0, b.x0), oy = Math.min(a.y1, b.y1) - Math.max(a.y0, b.y0);
    if (ox > 3 && oy > 5) issues.push('TEXT-OVERLAP: "' + a.s + '" x "' + b.s + '"');
  }
  const sr = stage.getBoundingClientRect(), sc = sr.width / W, fr = [];
  Object.keys(MATH).forEach(id => {
    const m = MATH[id]; if (m.el.style.visibility === 'hidden') return;
    const h = m.el.querySelector('.katex-html'); if (!h){ issues.push('FORMULA-NOT-RENDERED: ' + id); return; }

  T('e = ' + f2(c.e, 3), ex, cy + 52, { size: 15, weight: 700, color: P.red, align: 'center' });
  arrow(ex - 20, cy + 82, sx + 6, cy + 82, P.red, 3, 10);
  T('δ_{i} = ∂e/∂a_{i} = ' + f2(c.delta), (sx + ex) / 2, cy + 102, { size: 16, weight: 800, color: P.red, align: 'center' });
  /* gradients */
  const gy = y + 312;
  line(x + 24, gy - 14, x + w - 24, gy - 14, P.line, 1.4);
  T('每個權重的梯度 · gradient per weight', x + 24, gy + 2, { size: 16, weight: 800, maxW: 440 });
  T('∂e/∂w_{ℓ} = δ_{i} · z_{ℓ}', x + 24, gy + 24, { size: 15, weight: 700, color: P.red, maxW: 440 });
  const bc = x + 270, half = 100, sc = Math.max(1, ...c.g.map(Math.abs));
  line(bc, gy + 38, bc, gy + 142, P.faint, 1.6);
  c.g.forEach((g, i) => {
    const ry = gy + 58 + i * 34; T('∂e/∂w_{' + (i + 1) + '}', x + 24, ry, { size: 16, weight: 700 });
    const bw = g / sc * half; rr(Math.min(bc, bc + bw), ry - 12, Math.max(3, Math.abs(bw)), 24, 5); ctx.fillStyle = signCol(-g); ctx.fill();
    T(f2(g, 3), x + 440, ry, { size: 17, weight: 800, color: signCol(-g), align: 'right' });
  });
  wrap('梯度為正（紅）→ 該權重要調小；為負（藍）→ 調大。\nPositive (red): decrease w; negative (blue): increase w.', x + 24, gy + 158, 440, 19, 13.5, P.muted, 500);
  const chk = numCheck(); T('與數值微分相差 |Δ| = ' + chk.toExponential(1) + ' · matches numeric diff.', x + 24, gy + 206, { size: 13.5, weight: 700, color: P.green, maxW: 440 });
  /* sparkline */
  const sx0 = x + 508, sx1 = x + w - 32, sy0 = y + 352, sy1 = y + 480;
  panel(sx0 - 14, sy0 - 40, sx1 - sx0 + 28, sy1 - sy0 + 70, { r: 10, fill: '#f6f9ff', stroke: '#dbe5f3', lw: 1.2 });
  T('損失 e vs 步數 loss vs steps', sx0, sy0 - 22, { size: 14.5, weight: 800 });
  const hmax = Math.max(1e-6, ...st.hist), n = Math.max(2, st.hist.length);
  line(sx0, sy1, sx1, sy1, P.faint, 1.4);
  ctx.beginPath(); st.hist.forEach((v, i) => { const px = sx0 + (sx1 - sx0) * i / (n - 1 > 0 ? Math.max(n - 1, 5) : 1), py = sy1 - v / hmax * (sy1 - sy0); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); });
  ctx.strokeStyle = P.red; ctx.lineWidth = 2.8; ctx.lineJoin = 'round'; ctx.stroke();
  const lp = st.hist.length - 1; dot(sx0 + (sx1 - sx0) * lp / Math.max(n - 1, 5), sy1 - st.hist[lp] / hmax * (sy1 - sy0), 5, P.red, '#fff', 2);
  T('e = ' + f2(st.hist[lp], 4) + '   (步 step ' + lp + ')', sx1, sy1 + 18, { size: 14, weight: 800, color: P.red, align: 'right' });
}
