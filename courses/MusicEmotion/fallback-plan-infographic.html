<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>備案研究方向：音樂情緒特徵比較 · Infographic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#dfe6ea;--fg:#14232e;--mut:#55656f;--btn:#1b6f7f;--btnfg:#fff;--btn2:#fbfcfc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181e;--fg:#e6eef1;--mut:#93a4ad;--btn:#3aa0b3;--btnfg:#04161b;--btn2:#1b2830}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:1500px;margin:0 auto;padding:16px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.bar .t{font-weight:700;font-size:15px;margin-right:auto}
.bar .t small{display:block;font-weight:400;color:var(--mut);font-size:12px}
button{font:inherit;font-size:14px;font-weight:700;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;background:var(--btn);color:var(--btnfg)}
button.alt{background:var(--btn2);color:var(--fg);border:1px solid var(--mut)}
.stage{overflow:hidden;border-radius:4px;box-shadow:0 2px 14px rgba(0,0,0,.18)}
canvas,.stage img{display:block;width:100%;height:auto}
#msg{margin-top:10px;font-size:13px;color:var(--mut);min-height:1.4em}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="t">備案研究方向資訊圖表 Fallback Research Plan<small>16:9 · 3200 × 1800 px · 繁體中文＋English</small></div>
    <button id="dl" type="button">下載 JPG Download</button>
    <button id="asimg" type="button" class="alt">轉成圖片（長按／右鍵儲存）</button>
  </div>
  <div class="stage" id="stage"><canvas id="c" width="3200" height="1800" role="img" aria-label="備案研究方向資訊圖表：音樂情緒辨識的四類特徵比較"></canvas></div>
  <div id="msg"></div>
</div>
<script>
(function(){
const W=3200,H=1800,cv=document.getElementById('c'),g=cv.getContext('2d');
const FONT='"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
const C={bg:'#f3f6f8',ink:'#14232e',mut:'#55656f',card:'#ffffff',line:'#cfd8de',
  teal:'#1b6f7f',amber:'#e39b0b',rose:'#c2455a',violet:'#6a4fb3',green:'#2f8f5b'};

function rr(x,y,w,h,r,fill,stroke,lw){g.beginPath();g.roundRect(x,y,w,h,r);
  if(fill){g.fillStyle=fill;g.fill();}
  if(stroke){g.lineWidth=lw||2;g.strokeStyle=stroke;g.stroke();}}
function tx(s,x,y,size,weight,color,align){g.font=weight+' '+size+'px '+FONT;
  g.fillStyle=color;g.textAlign=align||'left';g.textBaseline='alphabetic';g.fillText(s,x,y);}
// wrap: latin words stay whole, CJK breaks per character
function wrap(s,x,y,maxW,lh,size,weight,color){g.font=weight+' '+size+'px '+FONT;
  g.fillStyle=color;g.textAlign='left';g.textBaseline='alphabetic';
  const toks=s.match(/[A-Za-z0-9._\-²%\/()+×]+|\s+|[^\sA-Za-z0-9]/g)||[];
  let line='';
  for(const t of toks){
    if(g.measureText(line+t).width>maxW&&line.trim()){g.fillText(line.trimEnd(),x,y);y+=lh;line=t.trimStart();}
    else line+=t;}
  if(line.trim()){g.fillText(line.trimEnd(),x,y);y+=lh;}
  return y;}
function panel(x,y,w,h,color,title,sub){
  rr(x,y,w,h,24,C.card,C.line,2);
  g.save();g.beginPath();g.roundRect(x,y,w,86,[24,24,0,0]);g.fillStyle=color;g.fill();g.restore();
  tx(title,x+34,y+58,40,'900','#fff');
  if(sub)tx(sub,x+w-34,y+56,24,'500','rgba(255,255,255,.85)','right');}
function arrow(x1,y,x2,color){g.strokeStyle=color;g.fillStyle=color;g.lineWidth=6;
  g.beginPath();g.moveTo(x1,y);g.lineTo(x2-14,y);g.stroke();
  g.beginPath();g.moveTo(x2,y);g.lineTo(x2-22,y-14);g.lineTo(x2-22,y+14);g.closePath();g.fill();}

function draw(){
  g.clearRect(0,0,W,H);g.fillStyle=C.bg;g.fillRect(0,0,W,H);
  // header
  const hg=g.createLinearGradient(0,0,W,0);hg.addColorStop(0,'#17495a');hg.addColorStop(1,'#1b6f7f');
  g.fillStyle=hg;g.fillRect(0,0,W,200);
  tx('備案研究方向：少量標註下，哪種音訊特徵最適合辨識音樂情緒？',80,92,62,'900','#fff');
  tx('Fallback plan · Which audio features work best for music emotion recognition with few labels?',80,148,32,'500','rgba(255,255,255,.88)');
  rr(2480,48,640,100,20,'rgba(255,255,255,.16)');
  tx('徐小惠 · 2026-10-03',2800,92,34,'700','#fff','center');
  tx('教授已核定 · 備案，非新作業',2800,132,26,'500','#ffe9b0','center');

  // A: when to start
  panel(80,230,1000,640,C.amber,'何時啟動？ When to start','先完成 W40 修正');
  const A=[['融合是否有實質進步','三位評審融合，須勝過「一律猜最常見情緒」與最佳單一評審（596 首輪流測試）'],
           ['八類情緒定義站得住嗎','重新檢討後，八類答案能否被合理區分'],
           ['歌詞評審有貢獻嗎','「三位評審」與「只用頻譜＋聲音」是否有明顯差別']];
  let y=368;A.forEach((a,i)=>{
    g.beginPath();g.arc(140,y+10,34,0,7);g.fillStyle=C.amber;g.fill();tx(String(i+1),140,y+24,40,'900','#fff','center');
    tx(a[0],200,y+8,34,'700',C.ink);y=wrap(a[1],200,y+54,820,40,28,'400',C.mut)+22;});
  rr(110,y-6,940,100,16,'#fff4d6');
  wrap('門檻不事先設定，由教授與小惠一起討論；現有成果都可沿用。',134,y+34,900,38,28,'700','#7a5300');

  // B: four features
  panel(1120,230,2000,640,C.teal,'四類特徵比較 Four feature families','每類都接同一個簡單預測器（嶺迴歸）');
  const F=[['F0','傳統特徵','梅爾頻譜 + openSMILE 聲音特徵，固定公式算出','基準 · 已完成',C.mut],
           ['F1','預訓練音樂模型','MERT、CLAP 聲音部分與 PANNs，直接把歌轉成數字','難度低 · 最先做',C.teal],
           ['F2','自訓 Autoencoder','用 800 首自製歌加 PMEmo 訓練歌，壓縮再還原，可做遮蔽式','難度中',C.violet],['F3','半監督 AE','同時做兩件事：還原頻譜、預測情緒（無答案的歌只做還原）','難度中高 · 最有新意',C.rose]];
  F.forEach((f,i)=>{const x=1150+i*490,w=440;
    rr(x,330,w,500,20,'#f7fafb',f[4],4);
    rr(x+24,352,96,70,16,f[4]);tx(f[0],x+72,404,44,'900','#fff','center');
    tx(f[1],x+138,404,32,'700',C.ink);
    wrap(f[2],x+30,490,w-60,54,34,'400',C.ink);
    rr(x+30,740,w-60,60,30,f[4]);tx(f[3],x+w/2,780,26,'700','#fff','center');
    if(i<3)arrow(x+w+4,580,x+w+46,C.mut);});

  // C: evaluation
  panel(80,910,1500,420,C.violet,'評估方式 Evaluation','PMEmo 596 首 · 以整首歌分組');
  tx('5 折交叉驗證（巢狀：挑設定只在訓練 4 份內進行）',120,1030,30,'700',C.ink);
  for(let i=0;i<5;i++){const x=120+i*162,t=i===3;
    rr(x,1050,146,70,12,t?C.rose:'#dfe6ea');tx(t?'測試':'訓練',x+73,1096,28,'700',t?'#fff':C.mut,'center');}
  tx('目標：正負面程度、激昂程度（PMEmo 人工標註，連續值）',120,1170,28,'500',C.ink);
  [['R²','解釋多少變化'],['相關係數','方向一致程度'],['RMSE','平均誤差']].forEach((m,i)=>{
    const x=120+i*270;rr(x,1196,250,86,14,'#efe9fb');tx(m[0],x+125,1236,32,'900',C.violet,'center');tx(m[1],x+125,1268,22,'400',C.mut,'center');});
  rr(930,1050,620,232,18,'#fbeef1',C.rose,3);
  tx('最低基準 Baseline',960,1100,32,'900',C.rose);
  wrap('一律猜訓練歌曲的平均值，任何特徵都必須先勝過它；多種隨機種子重複，並配對比較。',960,1150,570,38,26,'400',C.ink);

  // D: timeline
  panel(1620,910,1500,420,C.green,'建議時程 Timeline','粗估 11–15 週');
  const T=[['1 評估流程 + F0 基準',0,2],['2 F1 預訓練特徵',2,4],['3 F2 Autoencoder',4,8],['4 F3 半監督',8,12],['5 整理、寫論文',12,15]];
  const gx=2060,gw=1000,unit=gw/15;
  T.forEach((t,i)=>{const yy=1020+i*56;tx(t[0],1650,yy+28,26,'500',C.ink);
    rr(gx,yy,gw,38,10,'#eef2f4');rr(gx+t[1]*unit,yy,(t[2]-t[1])*unit,38,10,i<2?C.teal:i<4?C.violet:C.green);});
  tx('週 weeks',gx+gw,1310,22,'400',C.mut,'right');
  tx('階段 1–2 完成即可寫成論文章節；3–4 為加分項',1650,1310,24,'700','#1f6b44');

  // E: reuse
  panel(80,1370,1500,330,C.teal,'可沿用的現有成果 Reusable','工作不白費');
  ['PMEmo 整理與 438 首對齊經驗','800 首自製歌音檔與頻譜 → 自學材料','現有頻譜與 openSMILE → F0 基準','修正後的巢狀交叉驗證與配對比較'].forEach((s,i)=>{
    const x=120+(i%2)*720,yy=1510+Math.floor(i/2)*100;
    g.beginPath();g.arc(x+16,yy-10,15,0,7);g.fillStyle=C.teal;g.fill();wrap(s,x+44,yy,650,42,32,'500',C.ink);});

  // F: risks
  panel(1620,1370,1500,330,C.rose,'風險與注意 Risks','');
  ['學到的特徵不一定與情緒有關 → 用 F3 加入情緒資訊','自訓 Autoencoder 耗時 → 先用小模型、小資料','自製歌音檔只留本機，不可上傳 GitHub','損失值、種子、版本須由程式自動輸出，不可事後補'].forEach((s,i)=>{
    const x=1660+(i%2)*720,yy=1510+Math.floor(i/2)*100;
    g.beginPath();g.arc(x+16,yy-10,15,0,7);g.fillStyle=C.rose;g.fill();wrap(s,x+44,yy,650,42,30,'500',C.ink);});

  tx('文獻為依記憶整理，引用前請以 Google Scholar 核對 · 論文題目可隨研究需要調整',W/2,1760,26,'400',C.mut,'center');
}
draw();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(draw);
const msg=document.getElementById('msg');
function blob(cb){cv.toBlob(cb,'image/jpeg',.92);}
document.getElementById('dl').onclick=()=>blob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='fallback-plan-infographic.jpg';a.click();msg.textContent='已下載 JPG。';});
document.getElementById('asimg').onclick=()=>blob(b=>{const i=new Image();i.src=URL.createObjectURL(b);i.alt='備案研究方向資訊圖表';const s=document.getElementById('stage');s.innerHTML='';s.appendChild(i);msg.textContent='長按或右鍵即可儲存圖片。';});
})();
</script>
</body>
</html>
